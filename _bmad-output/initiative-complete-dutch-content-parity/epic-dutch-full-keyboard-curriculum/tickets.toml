[[entry]]
id = 1
type = "story"
title = "Set the full-keyboard curriculum and ship the first Shift lesson"
description = "After the existing course verification, write `full-keyboard-curriculum-outline.md` with the ordered stages, stable IDs, category mapping, cumulative key scope, practice types, and checkpoints, then deliver its first uppercase lesson to prove matrix-based Shift guidance, input, unlock, and progress work together."
verify = "`full-keyboard-curriculum-outline.md` maps every core and optional stage to matrix characters and lesson categories, defines the core/optional marker and the stage where each modifier is introduced, and a routed learner can complete the 16-letter foundation, pass the first uppercase lesson with correct keyboard and finger-guide cues, and resume progress after restart."
covers = ["FC-1", "FC-2", "FC-3", "FC-5", "FC-6"]
after = ["4.5"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Complete uppercase and Shift practice"
description = "Implement the remaining uppercase introduction, mixing, and review lessons from entry 1's `full-keyboard-curriculum-outline.md`, keeping the original letter lessons and IDs unchanged."
verify = "Curriculum tests prove the uppercase sequence follows the approved outline, uses the mapped physical letter keys and correct Shift guidance, and introduces no character before its prerequisite lesson."
covers = ["FC-1", "FC-2", "FC-3", "FC-6"]
after = [1]
hitl = false
risk = "medium"

